# MochaArch - politica de particionamento Calamares
#
# Objetivo:
# - Nunca deixar particionamento destrutivo pre-selecionado.
# - Usuario escolhe manualmente a estrategia.
# - Preservar instalacao lado a lado com Windows/outros sistemas.
# - Se o usuario escolher apagar/usar disco inteiro:
#   EFI FAT32 em /boot/efi com 2 GiB, raiz ext4 e /home XFS.
#
# Observacao:
# O Calamares antepoe automaticamente a particao EFI ao partitionLayout
# quando necessario em instalacoes UEFI.

efi:
  mountPoint: "/boot/efi"
  recommendedSize: 2048MiB
  minimumSize: 512MiB
  label: "EFI"

userSwapChoices:
  - none
  - small
  - file

luksGeneration: luks2
enableLuksAutomatedPartitioning: true
preCheckEncryption: false

allowManualPartitioning: true
alwaysShowPartitionLabels: true
drawNestedPartitions: false

initialPartitioningChoice: none
initialSwapChoice: none

defaultPartitionTableType: gpt
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "xfs"]

directoryFilesystemRestrictions:
  - mountpoint: "efi"
    allowedFilesystemTypes: ["fat32"]
    onlyWhenMountpoint: true
  - mountpoint: "/"
    allowedFilesystemTypes: ["ext4"]
    onlyWhenMountpoint: true
  - mountpoint: "/home"
    allowedFilesystemTypes: ["xfs", "ext4"]
    onlyWhenMountpoint: true

essentialMounts: [ "live-*", "control", "ventoy" ]

lvm:
  enable: true

partitionLayout:
  - name: "rootfs"
    type: "4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
    filesystem: "ext4"
    mountPoint: "/"
    size: 48G
    minSize: 28G
    maxSize: 96G

  - name: "home"
    type: "933ac7e1-2eb4-4f13-b844-0e14e2aef915"
    filesystem: "xfs"
    mountPoint: "/home"
    size: 100%
    minSize: 4G

requiredStorage: 40
