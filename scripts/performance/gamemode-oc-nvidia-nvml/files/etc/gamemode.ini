# Mocha — GameMode agressivo + OC leve NVIDIA
# Canônico: serviço baseline sem sudo, sem HOME obrigatório, sem keepalive interno.

[general]
reaper_freq=5
desiredgov=performance
desiredprof=performance
softrealtime=auto
renice=10
ioprio=0
inhibit_screensaver=1

[custom]
start=/usr/local/lib/mocha/gamemode-start-agressivo-oc.sh
end=/usr/local/lib/mocha/gamemode-end-agressivo-oc.sh
