# Mocha — GameMode agressivo
# Hooks legados do System76 removidos: o scheduler não está instalado.

[general]
reaper_freq=5
desiredgov=performance
softrealtime=auto
renice=10
ioprio=0
inhibit_screensaver=1

# Mocha — suspende o System76 apenas durante sessões GameMode.
[custom]
start=/usr/local/lib/mocha/performance/mocha-gamemode-start-authority-system
end=/usr/local/lib/mocha/performance/mocha-gamemode-end-authority-system
script_timeout=10
