[package]
name = "mocha-update"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Central gráfica de atualização e recuperação do Mocha"
publish = false
default-run = "mocha-update"

[dependencies]
cxx = "1.0"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
