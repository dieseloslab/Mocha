# Mocha — GameMode agressivo
# Hooks legados do System76 removidos: o scheduler não está instalado.

[general]
reaper_freq=5
desiredgov=performance
desiredprof=performance
softrealtime=auto
renice=10
ioprio=0
inhibit_screensaver=1

# Mocha — suspende o System76 apenas durante sessões GameMode.
[custom]
start=/usr/bin/sudo -n /usr/local/sbin/mocha-gamemode-system76 game-start
end=/usr/bin/sudo -n /usr/local/sbin/mocha-gamemode-system76 game-end
script_timeout=10
