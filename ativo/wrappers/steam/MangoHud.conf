# Mocha MangoHud canonico
# Fonte primaria: este arquivo, apontado pelo wrapper via MANGOHUD_CONFIGFILE.
# Layout: uma linha, sem graficos.
# Ordem: FPS, latencia, CPU, GPU, VRAM, hora HH:MM, GameMode.

legacy_layout=0
horizontal
position=top-left

fps
frametime
frame_timing=0

cpu_stats
gpu_stats
vram

time
time_format=%R

gamemode

font_size=26
background_alpha=0.45
round_corners=0
table_columns=32
no_display=0

toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
