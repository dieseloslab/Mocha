# Mocha MangoHud — config ativa comprovada via ${HOME}/.config/MangoHud/mocha-active.conf
# Não usar MANGOHUD_CONFIG inline.
# Não usar table_columns, frame_timing, histogram, graphs ou plot_bg.
legacy_layout=0
horizontal
hud_no_margin
position=top-left
font_size=17
round_corners=0
background_alpha=0.35
alpha=1.0

time
time_format="%H:%M"
time_no_label

fps
frametime
cpu_stats
cpu_temp
cpu_mhz
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
vram
ram
gamemode

toggle_hud=Shift_R+F12
reload_cfg=none
