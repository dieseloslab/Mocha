# Exemplo conceitual para usuário final MochaArch.
# Não aponta para CachyOS.
# URLs finais serão definidas quando o R2/domínio estiver pronto.

[mocha-kernel]
SigLevel = Required DatabaseOptional
Server = https://repo.mochaarch.org/stable/$repo/$arch

[mocha-core]
SigLevel = Required DatabaseOptional
Server = https://repo.mochaarch.org/stable/$repo/$arch

[mocha-gaming]
SigLevel = Required DatabaseOptional
Server = https://repo.mochaarch.org/stable/$repo/$arch
